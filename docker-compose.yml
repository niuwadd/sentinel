version: '3.8'

services:
  emqx:
    image: emqx:5.8
    container_name: climelens-emqx
    ports:
      - "1883:1883"    # TCP-MQTT  ← ESP32 设备连接
      - "8083:8083"    # WS-MQTT   ← React 前端连接
      - "18083:18083"  # Dashboard 管理界面
    environment:
      - EMQX_DASHBOARD__DEFAULT_USERNAME=admin
      - EMQX_DASHBOARD__DEFAULT_PASSWORD=${EMQX_ADMIN_PASSWORD:-public}
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: climelens-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: climelens-influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USERNAME:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD:-admin1234}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-climelens}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-sensors}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN:-dev-token}
    volumes:
      - influxdb_data:/var/lib/influxdb2
    restart: unless-stopped

volumes:
  emqx_data:
  emqx_log:
  redis_data:
  influxdb_data:
